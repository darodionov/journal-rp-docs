Даты в кавычках — обязательно. Это та самая граница, о которой я предупреждал: z.iso.date() ждёт строку "YYYY-MM-DD", но YAML-парсер незакавыченное 2018-04-19 самовольно превратит в объект Date — и safeParse упадёт с «expected string, received date». Кавычки выключают угадайку парсера. Проверь тестом оба варианта — с кавычками и без — и посмотри на ошибку своими глазами: это лучший урок про типы на границах данных.
Slug-regex строже, чем кажется: ^[a-z0-9-]+$ — только строчная латиница. Легасишный url может содержать заглавные или подчёркивания — тогда схема его завернёт, и это правильно: решение о нормализации слага принимаешь ты, а не молчаливый пропуск (слаг-политика — тема ADR-0006).