  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-face {\n  font-family: 'PT Sans Narrow';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4511efb6-5d35-4635-9e09-dc023b80f51b\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'PT Sans Narrow';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"9488d407-ce33-47d2-a80c-ea644eb3188b\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'PT Sans Narrow';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"9a4d1f3d-2100-4b0a-ab37-f554a666a1ff\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'PT Sans Narrow';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"35fb8f60-e504-468f-ab2f-310e667fa46e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'PT Sans Narrow';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"4cbc4580-6e0b-41e0-9e71-3b67914873d7\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'PT Sans Narrow';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"14f0a816-e0bb-4ad1-8eb8-62e7902c99e7\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'PT Sans Narrow';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ccffc544-bb77-4fb1-8363-856ddfac5455\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'PT Sans Narrow';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"54d78bfc-5e47-45e8-89e6-f3743261a5fc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ── Пункт 1 «Цвет» ЗАФИКСИРОВАН ────────────────────────────────\n     Бирюза → B (канон аудита) #65c6cd; приглушённый → B #939598;\n     остальное — наши значения A: коричневый #4d2b17, терракота #d4a187,\n     текст #565350, разделители #e1e1e1, фон страницы белый.\n     ──────────────────────────────────────────────────────────── */\n  /* Базовые */\n  --brown-900: #3d2210;        /* самый тёмный коричневый (логотип) */\n  --brown-800: #4d2b17;        /* фирменный коричневый: заголовки, нав, лого */\n  --brown-400: #7f6659;        /* приглушённый коричневый */\n  --teal-500: #55b3bb;         /* тёмная бирюза (hover) */\n  --teal-400: #65c6cd;         /* фирменная бирюза: кнопки, ссылки, цены (п.1 — канон аудита) */\n  --teal-300: #8bc8cf;         /* светлая бирюза */\n  --teal-100: #e0f2f4;         /* бирюзовая подложка */\n  --terracotta-500: #c98d6d;   /* тёмная терракота (hover) */\n  --terracotta-400: #d4a187;   /* фирменная терракота: цитаты, акценты, active-nav */\n  --terracotta-100: #f4e7e0;   /* терракотовая подложка */\n\n  /* Нейтральные */\n  --white: #ffffff;\n  --gray-100: #f7f7f7;         /* лёгкая подложка */\n  --gray-150: #f1f1f1;         /* фон сайдбар-блоков и карточек */\n  --gray-200: #e1e1e1;         /* линии-разделители */\n  --gray-300: #c6c6c6;         /* границы инпутов */\n  --gray-500: #939598;         /* приглушённый текст, футер (п.1 — канон аудита) */\n  --gray-700: #565350;         /* основной текст */\n\n  /* Семантические */\n  --surface-page: var(--white);\n  --surface-card: var(--gray-150);\n  --surface-input: var(--white);\n  --text-heading: var(--brown-800);\n  --text-body: var(--gray-700);\n  --text-muted: var(--gray-500);\n  --text-accent: var(--terracotta-400);\n  --text-on-accent: var(--white);\n  --link: var(--teal-400);\n  --link-hover: var(--teal-500);\n  --link-warm: var(--terracotta-400);     /* женские имена, месяцы, тёплые ссылки */\n  --link-warm-hover: var(--terracotta-500);\n  --border-divider: var(--gray-200);\n  --border-input: var(--gray-300);\n  --button-primary: var(--teal-400);\n  --button-primary-hover: var(--teal-500);\n  --button-warm: var(--terracotta-400);   /* кнопка «Отправить» в подписке */\n  --price: var(--teal-400);\n\n  /* Состояния и фокус (п. States) */\n  --focus-ring: 0 0 0 3px var(--teal-100);        /* видимое кольцо фокуса */\n  --focus-ring-warm: 0 0 0 3px var(--terracotta-100);\n  --state-hover-tint: rgba(77, 43, 23, 0.04);     /* лёгкая подложка hover на нейтральных строках */\n  --state-selected-bg: #faf6f1;                    /* выбранный пункт/строка */\n  --disabled-bg: var(--gray-300);\n  --disabled-text: var(--gray-500);\n  --danger: #b23b2e;                               /* ошибка формы (текст/граница) */\n  --danger-bg: #f6e7e4;                            /* подложка ошибки */\n  --success: #4a7a4a;                              /* успех/подтверждение */\n}\n\n:root {\n  /* ── Пункт 3 «Типографика» ЗАФИКСИРОВАН ─────────────────────────\n     H1 → A 24px; лейблы → B 12px / трекинг .14em; межстрочный тела → B 1.65;\n     трекинг навигации → A .18em; PT Sans Narrow → A (оставляем 2-ю гарнитуру).\n     ──────────────────────────────────────────────────────────── */\n  /* Одна база PT Sans + узкое начертание для подписей */\n  --font-sans: \"PT Sans\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-narrow: \"PT Sans Narrow\", \"Arial Narrow\", sans-serif;\n\n  /* Размеры. Заголовки и крупные ступени — флюидные clamp() (п.4), без промежуточных брейкпоинтов */\n  --fs-h1: clamp(1.25rem, 1.07rem + 0.9vw, 1.5rem);    /* 20 → 24px: H1 статьи (потолок 24px = выбор A, п.3) */\n  --fs-h2: clamp(1.125rem, 0.98rem + 0.7vw, 1.25rem);   /* 18 → 20px: секции */\n  --fs-h3: 1rem;               /* 16px: заголовки карточек */\n  --fs-body: 0.9375rem;        /* 15px: основной текст */\n  --fs-small: 0.8125rem;       /* 13px: аннотации, подписи, футер */\n  --fs-tiny: 0.75rem;          /* 12px: лейблы секций, даты (B) */\n  --fs-nav: 0.875rem;          /* 14px: главная навигация */\n\n  --lh-body: 1.65;             /* межстрочный основного текста, диапазон 1.6–1.7 (B, п.4) */\n  --lh-heading: 1.25;\n\n  /* Ключевой мотив: капс + разрядка */\n  --tracking-nav: 0.18em;      /* навигация (A): ЖУРНАЛ СОБЫТИЯ МАГАЗИН КНИГИ */\n  --tracking-label: 0.14em;    /* лейблы блоков (B): ИМЕНА, ПО МЕСЯЦАМ, СОБЫТИЯ */\n\n  --weight-regular: 400;\n  --weight-bold: 700;\n}\n\n:root {\n  /* ── Пункт 4 «Сетка / брейкпоинты» ЗАФИКСИРОВАН — mobile-first ──────\n     Три состояния раскладки, ДВА брейкпоинта (Tailwind md + lg):\n       • < 768px  (48rem)  — мобильная  (якорь макета 320)\n       • 768–1024 (48–64rem) — планшетная (якорь макета 768)\n       • ≥ 1024px (64rem)  — десктопная (якорь макета 1600)\n     sm / xl / 2xl НЕ используются. Выше lg брейкпоинтов нет.\n     Контент центрируется контейнером 80rem (1280px) с боковыми полями;\n     после 1280 растут ПОЛЯ, не контент.\n     Единицы брейкпоинтов и размеров — rem.\n     Мультиконтекстные компоненты (карточка материала: крупная/оверлей/мини;\n     товар: сайдбар/ряд/карусель) адаптируются контейнерными запросами\n     (@container), а не viewport-точками.\n     Заголовки и крупные ступени — флюидные через clamp().\n     Интерлиньяж тела статьи 1.6–1.7 (см. --lh-body в typography.css).\n     ──────────────────────────────────────────────────────────────── */\n\n  /* Шаг 4px (0.25rem) */\n  --space-1: 0.25rem;   /* 4  */\n  --space-2: 0.5rem;    /* 8  */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.25rem;   /* 20 */\n  --space-6: 1.5rem;    /* 24 */\n  --space-8: 2rem;      /* 32 */\n  --space-10: 2.5rem;   /* 40 */\n  --space-12: 3rem;     /* 48 */\n\n  /* Радиус: единый 3px на весь кит (зафиксировано — п.2, канон аудита) */\n  --radius: 3px;              /* кнопки, инпуты, карточки, блоки — всё */\n  --radius-sm: 3px;           /* алиасы для совместимости со старой разметкой */\n  --radius-md: 3px;\n\n  /* Брейкпоинты (только два — Tailwind md/lg) */\n  --breakpoint-md: 48rem;      /* 768px  — планшет */\n  --breakpoint-lg: 64rem;      /* 1024px — десктоп */\n\n  /* Контейнер */\n  --page-max: 80rem;           /* 1280px — центрирование контента; после — растут поля */\n  --page-pad: 1.25rem;         /* боковые поля (мобильный/планшет) */\n  --sidebar-w: 13.625rem;      /* 218px — колонки сайдбара на десктопе */\n  --gutter: 1.25rem;           /* 20px */\n\n  /* Тени не используются: плоские блоки с фоном и 1px-границами */\n  --border-w: 1px;\n}\n\n:root {\n  /* ── Motion ─────────────────────────────────────────────────────\n     Анимаций в системе почти нет: допустимы только короткие переходы\n     состояний (цвет фона/текста, граница, opacity). Никаких въездов,\n     параллаксов, «дыханий». Длительность — из этих токенов.\n     ──────────────────────────────────────────────────────────────── */\n  --dur-fast: 120ms;      /* hover/active ссылок и мелких элементов */\n  --dur: 150ms;           /* кнопки, поля, табы — база */\n  --dur-slow: 280ms;      /* выезд панели меню, оверлеи */\n\n  --ease: cubic-bezier(0.2, 0.6, 0.2, 1);      /* стандартный (вход+выход) */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);    /* появление (оверлей, дровер) */\n\n  /* Готовые переходы для копирования */\n  --transition-colors: color var(--dur) var(--ease), background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);\n  --transition-panel: transform var(--dur-slow) var(--ease-out);\n\n  /* Уважать prefers-reduced-motion — обязанность реализации:\n     при reduce переходы обнуляются (см. Design Guide, раздел Motion). */\n}\n\n<\u002Fstyle>\n<style>\n  :root {\n    --paper: #ffffff;\n    --paper-2: var(--gray-100);\n    --rule: var(--gray-200);\n    --rule-2: var(--gray-300);\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; background: var(--paper-2); color: var(--text-body); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }\n  .mono { font-family: var(--font-narrow); letter-spacing: .04em; }\n  .page { max-width: 1320px; margin: 0 auto; padding: 64px 56px 120px; background: var(--paper); }\n\n  /* Masthead */\n  .masthead { display: grid; grid-template-columns: 1fr auto; align-items: end; border-bottom: 2px solid var(--brown-800); padding-bottom: 24px; margin-bottom: 48px; }\n  .mast-left .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 18px; display: flex; gap: 24px; flex-wrap: wrap; }\n  .mast-left .eyebrow span:first-child { color: var(--terracotta-400); font-weight: 700; }\n  .mast-title { font-weight: 700; font-size: 56px; line-height: 1.05; letter-spacing: -.01em; margin: 0; color: var(--brown-800); }\n  .mast-title em { font-style: normal; color: var(--terracotta-400); }\n  .mast-right { text-align: right; font-size: 11px; color: var(--text-muted); letter-spacing: .04em; line-height: 1.8; }\n  .mast-right .row { display: flex; gap: 12px; justify-content: flex-end; }\n  .mast-right .k { color: var(--text-muted); letter-spacing: .1em; text-transform: uppercase; }\n  .mast-right .v { color: var(--text-body); }\n\n  .lede { max-width: 760px; font-size: 17px; line-height: 1.6; color: var(-
