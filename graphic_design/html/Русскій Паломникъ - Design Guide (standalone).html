-height: 1.35; color: var(--brown-800); }\n  .manifesto em { font-style: italic; color: var(--terracotta-400); font-weight: 400; }\n  .manifesto + .meta { margin-top: 24px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }\n\n  /* Logo */\n  .logo-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }\n  .logo-cell { background: var(--paper); padding: 28px; min-height: 200px; display: flex; flex-direction: column; justify-content: space-between; }\n  .logo-cell.dark { background: var(--brown-800); color: #f4ebe2; }\n  .logo-cell .lab { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }\n  .logo-cell.dark .lab { color: #cbb2a0; }\n  .logo-mark img { height: 84px; }\n  .logo-meta { display: flex; justify-content: space-between; align-items: baseline; }\n  .logo-meta .right { text-align: right; font-size: 10px; letter-spacing: .1em; color: var(--text-muted); }\n  .logo-cell.dark .logo-meta .right { color: #cbb2a0; }\n  .clearspace { position: relative; padding: 20px; flex: 1; display: flex; align-items: center; justify-content: center; }\n  .clearspace .box { border: 1px dashed var(--teal-400); padding: 24px; display: flex; align-items: center; justify-content: center; }\n  .clearspace .box img { height: 52px; }\n  .clearspace .x { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--teal-500); letter-spacing: .12em; text-transform: uppercase; }\n\n  /* Palette */\n  .palette-grid { display: grid; grid-template-columns: repeat(8,1fr); border: 1px solid var(--rule); }\n  .palette-grid .ramp-label { grid-column: span 8; display: flex; padding: 12px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--text-body); border-bottom: 1px solid var(--rule); justify-content: space-between; }\n  .palette-grid .ramp-label .hint { color: var(--text-muted); }\n  .chip { aspect-ratio: 1/1; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; font-size: 10px; letter-spacing: .04em; border-right: 1px solid rgba(0,0,0,.06); }\n  .chip:last-child { border-right: none; }\n  .chip.dark { color: rgba(255,255,255,.9); }\n  .chip.light { color: var(--text-body); }\n\n  .token-table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 12px; }\n  .token-table th, .token-table td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--rule); vertical-align: middle; }\n  .token-table th { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--text-muted); font-weight: 700; }\n  .token-table .swatch { width: 22px; height: 22px; border: 1px solid var(--rule); border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 10px; }\n  .token-table .name { color: var(--brown-800); }\n  .token-table .role { color: var(--text-body); font-size: 13px; }\n\n  /* Typography */\n  .type-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-bottom: 32px; }\n  .type-pair .cell { background: var(--paper); padding: 30px; }\n  .type-pair .label { display: flex; justify-content: space-between; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--text-muted); margin-bottom: 22px; }\n  .type-pair .specimen { font-weight: 700; font-size: 40px; line-height: 1.15; color: var(--brown-800); }\n  .type-pair .specimen em { font-style: normal; color: var(--terracotta-400); }\n  .type-pair .caps-specimen { font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 18px; color: var(--brown-800); line-height: 2; }\n  .type-pair .caps-specimen span { display: block; }\n  .type-pair .caps-specimen .warm { color: var(--terracotta-400); }\n\n  .type-scale { border: 1px solid var(--rule); background: var(--paper); }\n  .type-row { display: grid; grid-template-columns: 90px 1fr 110px 90px; align-items: baseline; gap: 18px; padding: 16px 22px; border-bottom: 1px solid var(--rule); }\n  .type-row:last-child { border-bottom: none; }\n  .type-row .key { font-size: 10px; color: var(--text-muted); letter-spacing: .12em; text-transform: uppercase; }\n  .type-row .face { font-size: 10px; color: var(--text-body); letter-spacing: .08em; text-transform: uppercase; text-align: right; }\n  .type-row .meta-r { font-size: 10px; color: var(--text-muted); letter-spacing: .08em; text-align: right; }\n\n  /* Spacing / grid */\n  .spacing { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }\n  .scale-vis { background: var(--paper); border: 1px solid var(--rule); padding: 26px; display: flex; flex-direction: column; gap: 12px; }\n  .step-row { display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; gap: 14px; font-size: 11px; color: var(--text-body); }\n  .step-row .k { color: var(--text-muted); letter-spacing: .1em; }\n  .step-row .bar { height: 8px; background: var(--teal-400); border-radius: 1px; }\n  .step-row .px { text-align: right; color: var(--brown-800); }\n\n  .grid-vis { background: var(--paper); border: 1px solid var(--rule); padding: 26px; min-height: 240px; }\n  .grid-vis .cols { display: grid; grid-template-columns: repeat(12,1fr); gap: 1px; height: 180px; }\n  .grid-vis .cols .c { background: var(--teal-100); }\n  .grid-vis .note { margin-top: 18px; display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); letter-spacing: .14em; text-transform: uppercase; }\n\n  .container-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; }\n  .container-table td, .container-table th { padding: 10px 14px; border-bottom: 1px solid var(--rule); text-align: left; }\n  .container-table th { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--text-muted); font-weight: 700; }\n\n  /* Iconography */\n  .icons-grid { display: grid; grid-template-columns: repeat(7,1fr); border: 1px solid var(--rule); }\n  .icon-cell { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--paper); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 16px; }\n  .icon-cell:nth-child(7n) { border-right: none; }\n  .icon-cell svg { width: 26px; height: 26px; stroke: var(--teal-400); stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }\n  .icon-cell .lab { font-size: 9px; color: var(--text-muted); letter-spacing: .1em; text-transform: uppercase; }\n\n  /* Components rack */\n  .comp-rack { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }\n  .comp-rack.two { grid-template-columns: repeat(2,1fr); }\n  .comp-cell { background: var(--paper); padding: 24px; display: flex; flex-direction: column; gap: 16px; min-height: 180px; }\n  .comp-cell .name { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }\n  .comp-cell .note { margin-top: auto; font-size: 10px; letter-spacing: .04em; color: var(--text-muted); }\n  .comp-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }\n  .comp-col { display: flex; flex-direction: column; gap: 10px; }\n\n  .btn { font-family: var(--font-sans); font-size: 13px; font-weight: 700; height: 30px; padding: 0 18px; border-radius: var(--radius-sm); border: none; background: var(--teal-400); color: #fff; cursor: pointer; }\n  .btn.warm { background: var(--terracotta-400); }\n  .btn.sm { height: 26px; padding: 0 12px; font-size: 12px; }\n  .btn.lg { height: 36px; padding: 0 26px; font-size: 14px; }\n  .btn[disabled] { background: var(--gray-300); }\n\n  .field { display: flex; flex-direction: column; gap: 5px; width: 100%; }\n  .field .label { font-size: 11px; color: var(--text-muted); }\n  .input { font-family: var(--font-sans); font-size: 14px; color: var(--text-body); height: 30px; padding: 0 10px; background: #fff; border: 1px solid var(--rule-2); border-radius: var(--radius-sm); outline: none; }\n  .input:focus { border-color: var(--teal-400); box-shadow: 0 0 0 3px var(--teal-100); }\n\n  .tabs-warm { display: flex; gap: 18px; }\n  .tabs-warm a { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--terracotta-400); text-decoration: none; }\n  .tabs-warm a.active { color: var(--teal-400); text-decoration: underline; text-underline-offset: 3px; }\n\n  .chip-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; padding: 4px 8px; border: 1px solid var(--rule-2); color: var(--text-body); border-radius: var(--radius-sm); display: inline-flex; gap: 6px; align-items: center; }\n  .chip-tag.warm { color: var(--terracotta-500); border-color: var(--terracotta-400); background: var(--terracotta-100); }\n  .chip-tag.cold { color: var(--teal-500); border-color: var(--teal-400); background: var(--teal-100); }\n\n  /* Cards */\n  .cards-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }\n  .card-shell { background: var(--paper-2); border-radius: var(--radius-sm); padding: 16px; display: flex; flex-direction: column; gap: 10px; }\n  .card-shell.line { background: #fff; border: 1px solid var(--rule); }\n  .card-shell .lab { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--terracotta-400); font-weight: 700; }\n  .card-shell .ttl { font-size: 15px; font-weight: 700; color: var(--brown-800); line-height: 1.3; }\n  .card-shell .price { font-size: 18px; color: var(--teal-400); }\n  .card-shell img { width: 100%; display: block; border-radius: 1px; }\n\n  /* Nav sample */\n  .nav-sample { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius-sm); padding: 14px 22px; }\n  .nav-sample .links { display: flex; gap: 26px; justify-content: center; }\n  .nav-sample a { font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brown-800); text-decoration: none; }\n  .nav-sample a.active { color: var(--terracotta-400); }\n\n  /* Voice */\n  .voice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }\n  .voice-cell { background: var(--paper); padding: 26px; }\n  .voice-cell .lab { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }\n  .voice-cell h4 { margin: 0 0 14px; font-weight: 700; font-size: 20px; color: var(--brown-800); }\n  .voice-cell h4 em { font-style: italic; color: var(--terracotta-400); }\n  .voice-line { display: grid; grid-template-columns: 74px 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--rule); }\n  .voice-line:last-child { border-bottom: none; }\n  .voice-line .k { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--teal-400); padding-top: 3px; }\n  .voice-line .k.no { color: var(--text-muted); text-decoration: line-through; }\n  .voice-line p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--brown-800); }\n  .voice-line.no p { color: var(--text-muted); text-decoration: line-through; }\n\n  /* A11y */\n  .a11y-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }\n  .a11y-card { background: var(--paper); border: 1px solid var(--rule); padding: 20px; border-radius: var(--radius-sm); display: flex; flex-direction: column; gap: 12px; }\n  .a11y-card .lab { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }\n  .a11y-card .demo { padding: 14px; border: 1px solid var(--rule); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; min-height: 74px; }\n  .a11y-card .ratio { font-size: 13px; color: var(--brown-800); display: flex; justify-content: space-between; }\n  .a11y-card .ratio .pass { color: var(--pos, #4a7a4a); }\n  .a11y-card p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--text-body); }\n\n  /* Principles */\n  .principles { display: grid; grid-template-columns: repeat(2,1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }\n  .principle { background: var(--paper); padding: 28px 26px; display: flex; flex-direction: column; gap: 12px; }\n  .principle .num { font-size: 11px; letter-spacing: .16em; color: var(--terracotta-400); font-weight: 700; }\n  .principle h3 { font-weight: 700; font-size: 22px; margin: 0; line-height: 1.2; color: var(--brown-800); }\n  .principle h3 em { font-style: normal; color: var(--terracotta-400); }\n  .principle p { margin: 0; font-size: 14px; line-height: 1.65; color: var(--text-body); }\n  .principle .vs { display: flex; gap: 12px; margin-top: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; }\n  .principle .vs .yes { color: var(--teal-500); }\n  .principle .vs .no { color: var(--text-muted); text-decoration: line-through; }\n\n  /* States */\n  .states-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }\n  .state-cell { background: var(--paper); padding: 22px 24px; }\n  .state-cell .name { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px; display: block; }\n  .state-row { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--rule); }\n  .state-row:last-child { border-bottom: none; }\n  .state-row .st { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-body); }\n  .state-row .st b { display: block; font-weight: 400; color: var(--text-muted); font-size: 10px; letter-spacing: .06em; text-transform: none; margin-top: 2px; }\n  .b-static { font-family: var(--font-sans); font-size: 13px; font-weight: 700; height: 30px; padding: 0 18px; border-radius: var(--radius); border: none; color: #fff; display: inline-flex; align-items: center; }\n  .link-demo { font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }\n\n  /* Motion */\n  .motion-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }\n  .motion-cell { background: var(--paper); padding: 24px; }\n  .motion-cell .name { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }\n  .track-row { display: grid; grid-template-columns: 90px 1fr 84px; align-items: center; gap: 14px; margin-top: 16px; font-size: 11px; }\n  .track-row .k { color: var(--text-body); letter-spacing: .08em; }\n  .track { height: 6px; border-radius: 3px; background: var(--teal-100); position: relative; overflow: hidden; }\n  .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: var(--teal-400); border-radius: 3px; animation: slide 2.6s var(--ease) infinite; }\n  .track.fast i { animation-duration: 1.5s; }\n  .track.slow i { animation-duration: 3.6s; }\n  .track-row .v { text-align: right; color: var(--text-muted); font-family: var(--font-narrow); }\n  @keyframes slide { 0% { transform: translateX(-40%); } 50% { transform: translateX(220%); } 100% { transform: translateX(-40%); } }\n  .hover-swatch { height: 30px; border-radius: var(--radius); background: var(--teal-400); color: #fff; display: inline-flex; align-items: center; padding: 0 18px; font-size: 13px; font-weight: 700; transition: var(--transition-colors); cursor: pointer; }\n  .hover-swatch:hover { background: var(--teal-500); }\n\n  /* Patterns */\n  .pat-grid { display: grid; grid-template-columns: 220px 1fr 1fr; gap: 16px; align-items: start; }\n  .pat-box { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); padding: 16px; }\n  .pat-box .lab { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--terracotta-400); font-weight: 700; margin-bottom: 12px; }\n  .cal-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-body); margin-bottom: 10px; }\n  .cal-head span.arw { color: var(--terracotta-400); cursor: pointer; font-size: 15px; }\n  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px 0; text-align: center; }\n  .cal-grid .wd { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }\n  .cal-grid .d { font-size: 12px; color: var(--text-muted); }\n  .cal-grid .d a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }\n  .alpha { display: flex; flex-wrap: wrap; gap: 8px 12px; }\n  .alpha a { font-size: 15px; font-weight: 700; color: var(--link); text-decoration: none; }\n  .prod { display: grid; grid-template-columns: 56px 1fr; gap: 12px; }\n  .prod img { width: 56px; height: 80px; object-fit: contain; }\n  .prod .a { font-size: 11px; color: var(--text-muted); }\n  .prod .t { font-size: 14px; font-weight: 700; color: var(--brown-800); line-height: 1.3; margin-top: 2px; }\n  .prod .meta { display: flex; gap: 12px; margin-top: 6px; font-size: 10px; }\n  .prod .meta .vw { color: var(--terracotta-400); } .prod .meta .rv { color: var(--teal-400); }\n\n  /* Empty / error / loading */\n  .status-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }\n  .status-card { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); overflow: hidden; }\n  .status-card .cap { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); padding: 10px 16px; border-bottom: 1px solid var(--rule); }\n  .status-body { padding: 26px 20px; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }\n  .status-body .big { font-size: 15px; font-weight: 700; color: var(--brown-800); }\n  .status-body .sm { font-size: 13px; line-height: 1.5; color: var(--text-muted); max-width: 220px; }\n  .skton { width: 100%; height: 12px; border-radius: 3px; background: linear-gradient(90deg, var(--gray-150) 25%, #eaeaea 37%, var(--gray-150) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }\n  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }\n  .err-field { width: 100%; }\n  .err-field input { width: 100%; box-sizing: border-box; height: 30px; padding: 0 10px; border: 1px solid var(--danger); border-radius: var(--radius); font-family: var(--font-sans); font-size: 14px; background: var(--danger-bg); color: var(--brown-800); outline: none; }\n  .err-field .msg { font-size: 12px; color: var(--danger); margin-top: 6px; text-align: left; }\n\n  .footer { margin-top: 80px; padding-top: 22px; border-top: 1px solid var(--brown-800); display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); letter-spacing: .14em; text-transform: uppercase; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"page\">\n\n  <!-- ============ MASTHEAD ============ -->\n  <header class=\"masthead\">\n    <div class=\"mast-left\">\n      <div class=\"eyebrow\">\n        <span>Русскій Паломникъ<\u002Fspan>\n        <span>Design Guide / V2<\u002Fspan>\n        <span>Решения 1–4 зафиксированы<\u002Fspan>\n      <\u002Fdiv>\n      <h1 class=\"mast-title\">Design <em>Guide<\u002Fem>.<\u002Fh1>\n    <\u002Fdiv>\n    <div class=\"mast-right\">\n      <div class=\"row\"><span class=\"k\">Источник<\u002Fspan><span class=\"v\">Скриншоты + аудит макетов<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span class=\"k\">Охват<\u002Fspan><span class=\"v\">Токены · компоненты · паттерны<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span class=\"k\">Сетка<\u002Fspan><span class=\"v\">4pt · md/lg · 1280 max<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span class=\"k\">Шрифт<\u002Fspan><span class=\"v\">PT Sans + Narrow<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <p class=\"lede\">\n    Этот документ — <strong>единый эталон<\u002Fstrong> дизайн-системы «Русскій Паломникъ»: тот же коричневый, та же бирюза,\n    та же терракота, что и на действующем портале. Здесь собраны токены, шкалы, компоненты и правила голоса —\n    всё, по чему собирается любая новая страница. Если решения нет в этом документе — <em>значит, его пока нет в системе<\u002Fem>.\n  <\u002Fp>\n\n  <!-- ============ 1. FOUNDATION ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Foundation<\u002Fh2><span class=\"num\">01 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Четыре опоры портала — медиа и издательский дом о вере, традиции и внутренней жизни. Любая деталь сверяется с ними.<\u002Fp>\n    <div class=\"foundation\">\n      <div class=\"pillars\">\n        <div class=\"pillar\"><span class=\"k\">01 · Спокойствие<\u002Fspan><h4>Тон — тихий, без нажима.<\u002Fh4><p>Ни восклицаний, ни маркетингового давления. Информация подаётся как факт для размышления.<\u002Fp><\u002Fdiv>\n        <div class=\"pillar\"><span class=\"k\">02 · Просвещение<\u002Fspan><h4>Портал учит, а не продаёт.<\u002Fh4><p>Житія, значения имён, календарь — контент всегда объясняет смысл прежде, чем предложит покупку.<\u002Fp><\u002Fdiv>\n        <div class=\"pillar\"><span class=\"k\">03 · Тепло традиции<\u002Fspan><h4>Дореформенная орфография как память.<\u002Fh4><p>Ъ и ѣ в бренде и заголовках — не стилизация, а связь с историей дома.<\u002Fp><\u002Fdiv>\n        <div class=\"pillar\"><span class=\"k\">04 · Ясность<\u002Fspan><h4>Плоские поверхности, чёткая иерархия.<\u002Fh4><p>Без теней и градиентов: подложка, разделитель, капс-лейбл — вот и вся структура страницы.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"manifesto\">Мы не оформляем веру.<br>Мы <em>даём ей место<\u002Fem> —<br>календарь, слово, тишину.<\u002Fdiv>\n        <div class=\"meta\">Brand voice · Manifesto v1<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 2. LOGO ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Logo &amp; wordmark<\u002Fh2><span class=\"num\">02 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Гравюра-паломник + текстовый lockup в дореформенной орфографии. Растровый оригинал — векторную версию нужно запросить у владельца.<\u002Fp>\n    <div class=\"logo-grid\">\n      <div class=\"logo-cell\">\n        <div class=\"lab\">Wordmark · полный<\u002Fdiv>\n        <div class=\"logo-mark\"><img src=\"bca51cab-6b5d-409e-911f-d130178ac27f\" alt=\"Русскій Паломникъ\"><\u002Fdiv>\n        <div class=\"logo-meta\"><span class=\"lab\">Primary lockup<\u002Fspan><span class=\"right\">Растровый PNG<br>требуется вектор<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"logo-cell dark\">\n        <div class=\"lab\">На тёмном<\u002Fdiv>\n        <div class=\"logo-mark\"><img src=\"9871dee8-092d-456d-ac63-94ffb914d030\" alt=\"Знак\" style=\"height:64px;filter:brightness(0) invert(1)\"><\u002Fdiv>\n        <div class=\"logo-meta\"><span class=\"lab\">Inverse · знак<\u002Fspan><span class=\"right\">Только фигура<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"logo-cell\">\n        <div class=\"lab\">Охранное поле<\u002Fdiv>\n        <div class=\"clearspace\">\n          <span class=\"x\">↕ отступ = высоте знака<\u002Fspan>\n          <div class=\"box\"><img src=\"9871dee8-092d-456d-ac63-94ffb914d030\" alt=\"\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 3. COLOR ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Color · шкалы и токены<\u002Fh2><span class=\"num\">03 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Белая страница + три фирменных цвета. Коричневый — голос бренда (заголовки, навигация). Бирюза — интерактив (кнопки, холодные ссылки, цены). Терракота — тепло (цитаты, женские имена, активный пункт меню).<\u002Fp>\n\n    <div class=\"palette-grid\" style=\"margin-bottom:14px;\">\n      <div class=\"ramp-label\"><span>Brown · голос бренда<\u002Fspan><span class=\"hint\">Заголовки, навигация, логотип<\u002Fspan><\u002Fdiv>\n      <div class=\"chip dark\" style=\"background:#3d2210\"><span>900<\u002Fspan><span>#3D2210<\u002Fspan><\u002Fdiv>\n      <div class=\"chip dark\" style=\"background:#4d2b17\"><span>800<\u002Fspan><span>#4D2B17<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:#7f6659;color:#fff\"><span>400<\u002Fspan><span>#7F6659<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:var(--gray-100)\"><span>—<\u002Fspan><span>gray-100<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:var(--gray-200)\"><span>—<\u002Fspan><span>gray-200<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:var(--gray-300)\"><span>—<\u002Fspan><span>gray-300<\u002Fspan><\u002Fdiv>\n      <div class=\"chip dark\" style=\"background:var(--gray-500)\"><span>—<\u002Fspan><span>gray-500<\u002Fspan><\u002Fdiv>\n      <div class=\"chip dark\" style=\"background:var(--gray-700)\"><span>—<\u002Fspan><span>gray-700<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"palette-grid\" style=\"margin-bottom:14px;\">\n      <div class=\"ramp-label\"><span>Teal · интерактив<\u002Fspan><span class=\"hint\">Кнопки, холодные ссылки, цены, алфавит имён<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:var(--teal-100)\"><span>100<\u002Fspan><span>#E0F2F4<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:var(--teal-300)\"><span>300<\u002Fspan><span>#8BC8CF<\u002Fspan><\u002Fdiv>\n      <div class=\"chip dark\" style=\"background:var(--teal-400)\"><span>400<\u002Fspan><span>#65C6CD<\u002Fspan><\u002Fdiv>\n      <div class=\"chip dark\" style=\"background:var(--teal-500)\"><span>500<\u002Fspan><span>#55B3BB<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:#fff\"><span>—<\u002Fspan><span>surface<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:#fff\"><span>—<\u002Fspan><span>surface<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:#fff\"><span>—<\u002Fspan><span>surface<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:#fff\"><span>—<\u002Fspan><span>surface<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"palette-grid\">\n      <div class=\"ramp-label\"><span>Terracotta · тепло<\u002Fspan><span class=\"hint\">Цитаты, женские имена, активная навигация, лейблы<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:var(--terracotta-100)\"><span>100<\u002Fspan><span>#F4E7E0<\u002Fspan><\u002Fdiv>\n      <div class=\"chip dark\" style=\"background:var(--terracotta-400)\"><span>400<\u002Fspan><span>#D4A187<\u002Fspan><\u002Fdiv>\n      <div class=\"chip dark\" style=\"background:var(--terracotta-500)\"><span>500<\u002Fspan><span>#C98D6D<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:#fff\"><span>—<\u002Fspan><span>surface<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:#fff\"><span>—<\u002Fspan><span>surface<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:#fff\"><span>—<\u002Fspan><span>surface<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:#fff\"><span>—<\u002Fspan><span>surface<\u002Fspan><\u002Fdiv>\n      <div class=\"chip light\" style=\"background:#fff\"><span>—<\u002Fspan><span>surface<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sub-head\"><h3>Семантические <em>токены<\u002Fem><\u002Fh3><span class=\"tag-r\">tokens/colors.css<\u002Fspan><\u002Fdiv>\n    <table class=\"token-table\">\n      <thead><tr><th>Токен<\u002Fth><th>Значение<\u002Fth><th>Роль<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td><span class=\"swatch\" style=\"background:#fff;border:1px solid var(--rule)\"><\u002Fspan><span class=\"name\">--surface-page<\u002Fspan><\u002Ftd><td>#FFFFFF<\u002Ftd><td class=\"role\">Холст страницы — всегда чистый белый.<\u002Ftd><\u002Ftr>\n        <tr><td><span class=\"swatch\" style=\"background:var(--gray-150)\"><\u002Fspan><span class=\"name\">--surface-card<\u002Fspan><\u002Ftd><td>#F1F1F1<\u002Ftd><td class=\"role\">Плоские блоки сайдбара, без тени.<\u002Ftd><\u002Ftr>\n        <tr><td><span class=\"swatch\" style=\"background:var(--brown-800)\"><\u002Fspan><span class=\"name\">--text-heading<\u002Fspan><\u002Ftd><td>#4D2B17<\u002Ftd><td class=\"role\">Все заголовки h1–h3.<\u002Ftd><\u002Ftr>\n        <tr><td><span class=\"swatch\" style=\"background:var(--gray-700)\"><\u002Fspan><span class=\"name\">--text-body<\u002Fspan><\u002Ftd><td>#565350<\u002Ftd><td class=\"role\">Основной текст, 15px/1.65.<\u002Ftd><\u002Ftr>\n        <tr><td><span class=\"swatch\" style=\"background:var(--gray-500)\"><\u002Fspan><span class=\"name\">--text-muted<\u002Fspan><\u002Ftd><td>#939598<\u002Ftd><td class=\"role\">Даты, подписи, футер.<\u002Ftd><\u002Ftr>\n        <tr><td><span class=\"swatch\" style=\"background:var(--teal-400)\"><\u002Fspan><span class=\"name\">--link / --button-primary<\u002Fspan><\u002Ftd><td>#65C6CD<\u002Ftd><td class=\"role\">Холодные ссылки, кнопки, цены.<\u002Ftd><\u002Ftr>\n        <tr><td><span class=\"swatch\" style=\"background:var(--terracotta-400)\"><\u002Fspan><span class=\"name\">--link-warm<\u002Fspan><\u002Ftd><td>#D4A187<\u002Ftd><td class=\"role\">Женские имена, месяцы, активная навигация, цитаты.<\u002Ftd><\u002Ftr>\n        <tr><td><span class=\"swatch\" style=\"background:var(--gray-200)\"><\u002Fspan><span class=\"name\">--border-divider<\u002Fspan><\u002Ftd><td>#E1E1E1<\u002Ftd><td class=\"role\">Единственный способ разделить секции — тонкая линия.<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n  <\u002Fsection>\n\n  <!-- ============ 4. TYPOGRAPHY ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Typography<\u002Fh2><span class=\"num\">04 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Две гарнитуры: <strong>PT Sans<\u002Fstrong> (текст и заголовки) и <strong>PT Sans Narrow<\u002Fstrong> (подписи, подзаголовки-лейблы). Разделение ролей идёт капсом и разрядкой. Заголовки — флюидные clamp(); интерлиньяж тела 1.65.<\u002Fp>\n\n    <div class=\"type-pair\">\n      <div class=\"cell\">\n        <div class=\"label\"><span>Заголовок · PT Sans 700<\u002Fspan><span>clamp 20–24<\u002Fspan><\u002Fdiv>\n        <div class=\"specimen\">Именины<br><em>сегодня<\u002Fem><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"label\"><span>Капс + разрядка<\u002Fspan><span>Фирменный мотив<\u002Fspan><\u002Fdiv>\n        <div class=\"caps-specimen\">\n          <span>ЖУРНАЛ&nbsp;&nbsp;СОБЫТИЯ&nbsp;&nbsp;<span class=\"warm\">МАГАЗИН КНИГИ<\u002Fspan><\u002Fspan>\n          <span class=\"warm\">ПО МЕСЯЦАМ<\u002Fspan>\n          <span style=\"color:var(--text-muted)\">ЖИТІЯ СВЯТЫХЪ<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sub-head\"><h3>Шкала <em>и роли<\u002Fem><\u002Fh3><span class=\"tag-r\">tokens/typography.css<\u002Fspan><\u002Fdiv>\n    <div class=\"type-scale\">\n      <div class=\"type-row\"><span class=\"key\">H1 · 20–24<\u002Fspan><span style=\"font-size:24px;font-weight:700;color:var(--brown-800)\">Преподобномученик Ефрем<\u002Fspan><span class=\"face\">clamp() флюид<\u002Fspan><span class=\"meta-r\">заголовок статьи<\u002Fspan><\u002Fdiv>\n      <div class=\"type-row\"><span class=\"key\">H2 · 20<\u002Fspan><span style=\"font-size:20px;font-weight:700;color:var(--brown-800)\">Именины сегодня, 24 января:<\u002Fspan><span class=\"face\">PT Sans 700<\u002Fspan><span class=\"meta-r\">секция<\u002Fspan><\u002Fdiv>\n      <div class=\"type-row\"><span class=\"key\">H3 · 16<\u002Fspan><span style=\"font-size:16px;font-weight:700;color:var(--brown-800)\">Как назвать ребенка?<\u002Fspan><span class=\"face\">PT Sans 700<\u002Fspan><span class=\"meta-r\">блок<\u002Fspan><\u002Fdiv>\n      <div class=\"type-row\"><span class=\"key\">BODY · 15<\u002Fspan><span style=\"font-size:15px;line-height:1.65;color:var(--text-body)\">Именины — день памяти святого, чьё имя было дано при крещении.<\u002Fspan><span class=\"face\">PT Sans 400<\u002Fspan><span class=\"meta-r\">1.65<\u002Fspan><\u002Fdiv>\n      <div class=\"type-row\"><span class=\"key\">NAV · 14<\u002Fspan><span style=\"font-size:14px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brown-800)\">Магазин книги<\u002Fspan><span class=\"face\">tracking .18em<\u002Fspan><span class=\"meta-r\">меню<\u002Fspan><\u002Fdiv>\n      <div class=\"type-row\"><span class=\"key\">SMALL · 13<\u002Fspan><span style=\"font-size:13px;color:var(--text-muted)\">Календарь «Целебник» подготовлен православными врачами.<\u002Fspan><span class=\"face\">PT Sans 400<\u002Fspan><span class=\"meta-r\">аннотация<\u002Fspan><\u002Fdiv>\n      <div class=\"type-row\"><span class=\"key\">NARROW<\u002Fspan><span style=\"font-family:var(--font-narrow);font-size:15px;color:var(--text-body);letter-spacing:.02em\">из книги «Девять слов». Монах Симеон Афонский<\u002Fspan><span class=\"face\">PT Sans Narrow<\u002Fspan><span class=\"meta-r\">подписи<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 5. SPACING & GRID ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Spacing · grid<\u002Fh2><span class=\"num\">05 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Mobile-first, шаг 4px (0.25rem). Два брейкпоинта — md 48rem/768 и lg 64rem/1024; sm/xl/2xl не используются. Контейнер 80rem (1280px), далее растут поля, не контент. Радиус 3px везде, теней нет. Единицы — rem.<\u002Fp>\n    <div class=\"spacing\">\n      <div class=\"scale-vis\">\n        <div class=\"step-row\"><span class=\"k\">4<\u002Fspan><div class=\"bar\" style=\"width:4px\"><\u002Fdiv><span class=\"px\">4 px<\u002Fspan><\u002Fdiv>\n        <div class=\"step-row\"><span class=\"k\">8<\u002Fspan><div class=\"bar\" style=\"width:8px\"><\u002Fdiv><span class=\"px\">8 px<\u002Fspan><\u002Fdiv>\n        <div class=\"step-row\"><span class=\"k\">12<\u002Fspan><div class=\"bar\" style=\"width:12px\"><\u002Fdiv><span class=\"px\">12 px<\u002Fspan><\u002Fdiv>\n        <div class=\"step-row\"><span class=\"k\">16<\u002Fspan><div class=\"bar\" style=\"width:16px\"><\u002Fdiv><span class=\"px\">16 px<\u002Fspan><\u002Fdiv>\n        <div class=\"step-row\"><span class=\"k\">20<\u002Fspan><div class=\"bar\" style=\"width:20px\"><\u002Fdiv><span class=\"px\">20 px<\u002Fspan><\u002Fdiv>\n        <div class=\"step-row\"><span class=\"k\">24<\u002Fspan><div class=\"bar\" style=\"width:24px\"><\u002Fdiv><span class=\"px\">24 px<\u002Fspan><\u002Fdiv>\n        <div class=\"step-row\"><span class=\"k\">32<\u002Fspan><div class=\"bar\" style=\"width:32px\"><\u002Fdiv><span class=\"px\">32 px<\u002Fspan><\u002Fdiv>\n        <div class=\"step-row\"><span class=\"k\">48<\u002Fspan><div class=\"bar\" style=\"width:48px\"><\u002Fdiv><span class=\"px\">48 px<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"grid-vis\">\n        <div class=\"cols\"><div class=\"c\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><div class=\"c\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"note\"><span>Сайдбар 218<\u002Fspan><span>Центр — резина<\u002Fspan><span>Гаттер 20–24<\u002Fspan><span>Max 1280 (80rem)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sub-head\"><h3>Брейкпоинты <em>— mobile-first<\u002Fem><\u002Fh3><span class=\"tag-r\">только md + lg<\u002Fspan><\u002Fdiv>\n    <table class=\"container-table\">\n      <thead><tr><th>Состояние<\u002Fth><th>Диапазон<\u002Fth><th>Якорь макета<\u002Fth><th>Особенность<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>Мобильная<\u002Ftd><td>&lt; 48rem (768)<\u002Ftd><td>320<\u002Ftd><td>Одна колонка, полноэкранное меню, товарный блок встроен в тело<\u002Ftd><\u002Ftr>\n        <tr><td>Планшетная<\u002Ftd><td>48–64rem (768–1024)<\u002Ftd><td>768<\u002Ftd><td>Подменю «ПО АЛФАВИТУ | ПО МЕСЯЦУ | ПО ДАТЕ», сайдбар сворачивается<\u002Ftd><\u002Ftr>\n        <tr><td>Десктопная<\u002Ftd><td>≥ 64rem (1024)<\u002Ftd><td>1600<\u002Ftd><td>Трёхколоночная сетка, выезжающая левая панель меню; контент центрируется 1280, далее — поля<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n    <p class=\"section-intro\" style=\"margin-top:20px\">Мультиконтекстные компоненты (карточка материала: крупная/оверлей/мини; товар: сайдбар/ряд/карусель) адаптируются <em>контейнерными запросами<\u002Fem> (@container), а не viewport-точками. Заголовки и крупные ступени — флюидные через clamp(); интерлиньяж тела 1.6–1.7.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============ 6. ICONOGRAPHY ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Iconography<\u002Fh2><span class=\"num\">06 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Hairline-иконки, бирюзовый stroke 1.4px. Своего иконфонта не обнаружено — ближайшее по духу решение: тонкий набор в духе Lucide.<\u002Fp>\n    <div class=\"icons-grid\">\n      <div class=\"icon-cell\"><svg viewBox=\"0 0 24 24\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-4-4\"><\u002Fpath><\u002Fsvg><span class=\"lab\">Поиск<\u002Fspan><\u002Fdiv>\n      <div class=\"icon-cell\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"1\"><\u002Frect><path d=\"M3 9h18M8 3v4M16 3v4\"><\u002Fpath><\u002Fsvg><span class=\"lab\">Календарь<\u002Fspan><\u002Fdiv>\n      <div class=\"icon-cell\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"1\"><\u002Frect><path d=\"M10 9l5 3-5 3z\"><\u002Fpath><\u002Fsvg><span class=\"lab\">Видео<\u002Fspan><\u002Fdiv>\n      <div class=\"icon-cell\"><svg viewBox=\"0 0 24 24\"><ellipse cx=\"12\" cy=\"10\" rx=\"9\" ry=\"7\"><\u002Fellipse><path d=\"M8 17l-1 4 5-4\"><\u002Fpath><\u002Fsvg><span class=\"lab\">Отзыв<\u002Fspan><\u002Fdiv>\n      <div class=\"icon-cell\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 4h12M6 20h12M9 4l-3 8 3 8M15 4l3 8-3 8\"><\u002Fpath><\u002Fsvg><span class=\"lab\">Кавычки<\u002Fspan><\u002Fdiv>\n      <div class=\"icon-cell\"><svg viewBox=\"0 0 24 24\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg><span class=\"lab\">Назад<\u002Fspan><\u002Fdiv>\n      <div class=\"icon-cell\"><svg viewBox=\"0 0 24 24\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><span class=\"lab\">Вперёд<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 7. CONTROLS ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Controls · buttons &amp; fields<\u002Fh2><span class=\"num\">07 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Кнопки — заливка бирюзой (или терракотой для подписки), радиус 3px, без тени. Поля — белые, тонкая серая рамка, фокус — бирюзовое кольцо.<\u002Fp>\n    <div class=\"comp-rack\">\n      <div class=\"comp-cell\">\n        <span class=\"name\">Кнопки<\u002Fspan>\n        <div class=\"comp-col\">\n          <div class=\"comp-row\"><button class=\"btn lg\">Узнать<\u002Fbutton><\u002Fdiv>\n          <div class=\"comp-row\"><button class=\"btn\">В корзину<\u002Fbutton><button class=\"btn warm\">Отправить<\u002Fbutton><\u002Fdiv>\n          <div class=\"comp-row\"><button class=\"btn sm\">Узнать<\u002Fbutton><button class=\"btn\" disabled=\"\">Узнать<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"note\">30 / 36 / 26 · radius 3 · без тени<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"comp-cell\">\n        <span class=\"name\">Поля<\u002Fspan>\n        <div class=\"comp-col\">\n          <div class=\"field\"><span class=\"label\">Ваше Имя<\u002Fspan><input class=\"input\" placeholder=\"Евпат\"><\u002Fdiv>\n          <div class=\"field\"><span class=\"label\">Дата рождения<\u002Fspan><input class=\"input\" placeholder=\"ДД.ММ.ГГГГ\"><\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"note\">граница 1px gray-300 · фокус teal-100<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"comp-cell\">\n        <span class=\"name\">Табы и теги<\u002Fspan>\n        <div class=\"comp-col\">\n          <div class=\"tabs-warm\"><a class=\"active\">Мужские<\u002Fa><a>Женские<\u002Fa><\u002Fdiv>\n          <div class=\"comp-row\">\n            <span class=\"chip-tag cold\">Виталий<\u002Fspan>\n            <span class=\"chip-tag warm\">Агния<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"note\">мужские — бирюза, женские — терракота<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 8. STATES ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>States &amp; interactions<\u002Fh2><span class=\"num\">08 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Каждый интерактивный элемент имеет пять состояний. Переход между ними — только цвет, длительность <em>--dur (150ms)<\u002Fem>. Фокус виден всегда — кольцо <em>--focus-ring<\u002Fem>, никогда не снимается для мыши в ущерб клавиатуре.<\u002Fp>\n    <div class=\"states-grid\">\n      <div class=\"state-cell\">\n        <span class=\"name\">Кнопка (primary)<\u002Fspan>\n        <div class=\"state-row\"><span class=\"st\">Default<b>--button-primary<\u002Fb><\u002Fspan><button class=\"b-static\" style=\"background:var(--teal-400)\">Узнать<\u002Fbutton><\u002Fdiv>\n        <div class=\"state-row\"><span class=\"st\">Hover<b>--button-primary-hover<\u002Fb><\u002Fspan><button class=\"b-static\" style=\"background:var(--teal-500)\">Узнать<\u002Fbutton><\u002Fdiv>\n        <div class=\"state-row\"><span class=\"st\">Active<b>нажатие, тот же тон<\u002Fb><\u002Fspan><button class=\"b-static\" style=\"background:var(--teal-500);transform:translateY(1px)\">Узнать<\u002Fbutton><\u002Fdiv>\n        <div class=\"state-row\"><span class=\"st\">Focus<b>--focus-ring<\u002Fb><\u002Fspan><button class=\"b-static\" style=\"background:var(--teal-400);box-shadow:var(--focus-ring)\">Узнать<\u002Fbutton><\u002Fdiv>\n        <div class=\"state-row\"><span class=\"st\">Disabled<b>--disabled-bg<\u002Fb><\u002Fspan><button class=\"b-static\" style=\"background:var(--disabled-bg);color:#fff\">Узнать<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"state-cell\">\n        <span class=\"name\">Поле ввода<\u002Fspan>\n        <div class=\"state-row\"><span class=\"st\">Default<b>1px gray-300<\u002Fb><\u002Fspan><input class=\"input\" style=\"width:100%\" placeholder=\"Евпат\"><\u002Fdiv>\n        <div class=\"state-row\"><span class=\"st\">Focus<b>граница teal + кольцо<\u002Fb><\u002Fspan><input class=\"input\" style=\"width:100%;border-color:var(--teal-400);box-shadow:var(--focus-ring)\" value=\"Евпат\"><\u002Fdiv>\n        <div class=\"state-row\"><span class=\"st\">Error<b>--danger<\u002Fb><\u002Fspan><input class=\"input\" style=\"width:100%;border-color:var(--danger);background:var(--danger-bg)\" value=\"12.13.2016\"><\u002Fdiv>\n        <div class=\"state-row\"><span class=\"st\">Disabled<b>серая заливка<\u002Fb><\u002Fspan><input class=\"input\" style=\"width:100%;background:var(--gray-150);color:var(--disabled-text)\" value=\"—\" disabled=\"\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"state-cell\">\n        <span class=\"name\">Ссылка-имя (холодная)<\u002Fspan>\n        <div class=\"state-row\"><span class=\"st\">Default<\u002Fspan><a class=\"link-demo\" style=\"color:var(--link)\">Максим<\u002Fa><\u002Fdiv>\n        <div class=\"state-row\"><span class=\"st\">Hover<b>темнее, --dur-fast<\u002Fb><\u002Fspan><a class=\"link-demo\" style=\"color:var(--link-hover)\">Максим<\u002Fa><\u002Fdiv>\n        <div class=\"state-row\"><span class=\"st\">Focus<\u002Fspan><a class=\"link-demo\" style=\"color:var(--link);box-shadow:var(--focus-ring);border-radius:2px\">Максим<\u002Fa><\u002Fdiv>\n        <div class=\"state-row\"><span class=\"st\">Visited<b>тон сохраняется<\u002Fb><\u002Fspan><a class=\"link-demo\" style=\"color:var(--link)\">Максим<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"state-cell\">\n        <span class=\"name\">Строка списка / выбор<\u002Fspan>\n        <div class=\"state-row\"><span class=\"st\">Default<\u002Fspan><span style=\"font-size:13px;color:var(--text-body)\">Январь <span style=\"color:var(--text-muted)\">(231)<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div class=\"state-row\"><span class=\"st\">Hover<b>--state-hover-tint<\u002Fb><\u002Fspan><span style=\"font-size:13px;color:var(--text-body);background:var(--state-hover-tint);padding:4px 8px;border-radius:2px\">Январь <span style=\"color:var(--text-muted)\">(231)<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div class=\"state-row\"><span class=\"st\">Selected<b>--state-selected-bg<\u002Fb><\u002Fspan><span style=\"font-size:13px;color:var(--brown-800);background:var(--state-selected-bg);box-shadow:inset 0 0 0 2px var(--terracotta-400);padding:4px 8px;border-radius:2px\">Январь<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 9. MOTION ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Motion<\u002Fh2><span class=\"num\">09 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Система почти статична. Разрешены только короткие переходы состояний и выезд панели/оверлея. Никаких въездов контента, параллаксов и «дыханий». Всё уважает <em>prefers-reduced-motion<\u002Fem> — при reduce длительности обнуляются.<\u002Fp>\n    <div class=\"motion-grid\">\n      <div class=\"motion-cell\">\n        <span class=\"name\">Длительности · easing<\u002Fspan>\n        <div class=\"track-row\"><span class=\"k\">fast<\u002Fspan><div class=\"track fast\"><i><\u002Fi><\u002Fdiv><span class=\"v\">120ms<\u002Fspan><\u002Fdiv>\n        <div class=\"track-row\"><span class=\"k\">base<\u002Fspan><div class=\"track\"><i><\u002Fi><\u002Fdiv><span class=\"v\">150ms<\u002Fspan><\u002Fdiv>\n        <div class=\"track-row\"><span class=\"k\">slow<\u002Fspan><div class=\"track slow\"><i><\u002Fi><\u002Fdiv><span class=\"v\">280ms<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:16px;font-size:11px;line-height:1.7;color:var(--text-muted);font-family:var(--font-narrow)\">\n          --ease · cubic-bezier(.2,.6,.2,1) — состояния<br>\n          --ease-out · cubic-bezier(.16,1,.3,1) — появление\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"motion-cell\">\n        <span class=\"name\">Где применяется<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:16px;font-size:13px;color:var(--text-body);line-height:1.5\">\n          <div><span style=\"color:var(--teal-500);font-weight:700\">base<\u002Fspan> — кнопки, поля, табы: цвет фона/границы<\u002Fdiv>\n          <div><span style=\"color:var(--teal-500);font-weight:700\">fast<\u002Fspan> — ссылки-имена, пункты меню: цвет текста<\u002Fdiv>\n          <div><span style=\"color:var(--teal-500);font-weight:700\">slow<\u002Fspan> — выезд левой панели «Журнал», оверлей поиска (transform + opacity)<\u002Fdiv>\n          <div style=\"margin-top:6px\">Наведите: <span class=\"hover-swatch\">Узнать<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 10. CARDS ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Cards &amp; surfaces<\u002Fh2><span class=\"num\">10 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Плоские поверхности: подложка `--surface-card` или белая с рамкой. Радиус 3px, без теней и градиентов, кроме затемнения на фото-тизерах.<\u002Fp>\n    <div class=\"cards-row\">\n      <div class=\"card-shell\">\n        <span class=\"lab\">Библиотека<\u002Fspan>\n        <img src=\"6ba43c80-60c4-4016-9978-a65c2a243b4e\" alt=\"\" style=\"max-width:110px;align-self:center\">\n        <div class=\"ttl\">Просто мама<\u002Fdiv>\n        <div class=\"price\">180 р<\u002Fdiv>\n        <button class=\"btn sm\" style=\"width:100%\">В корзину<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"card-shell line\">\n        <span class=\"lab\">Цитата<\u002Fspan>\n        <div style=\"font-size:13px;line-height:1.5;color:var(--terracotta-400)\">«Послушание – это сокровенные духовные отношения между Старцем и послушником…»<\u002Fdiv>\n        <div style=\"font-size:12px;font-style:italic;color:var(--terracotta-400);text-align:right\">Монах Симеон Афонский<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card-shell line\">\n        <span class=\"lab\">События<\u002Fspan>\n        <div style=\"font-size:12px;color:var(--terracotta-400)\">23 января 2016<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:var(--text-body)\">Схи-Игуменія Софія въ юныя годы, будучи вѣтвью оптинскаго древа Святой Руси.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 11. DATA-DISPLAY PATTERNS ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Data-display patterns<\u002Fh2><span class=\"num\">11 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Собранные блоки портала, из которых строятся сайдбары именин и магазина. Каждый — плоский, с капс-лейблом и тонкими разделителями.<\u002Fp>\n    <div class=\"pat-grid\">\n      <div class=\"pat-box\">\n        <div class=\"lab\">Календарь<\u002Fdiv>\n        <div class=\"cal-head\"><span class=\"arw\">←<\u002Fspan><span>Январь 2016<\u002Fspan><span class=\"arw\">→<\u002Fspan><\u002Fdiv>\n        <div class=\"cal-grid\">\n          <div class=\"wd\">Пн<\u002Fdiv><div class=\"wd\">Вт<\u002Fdiv><div class=\"wd\">Ср<\u002Fdiv><div class=\"wd\">Чт<\u002Fdiv><div class=\"wd\">Пт<\u002Fdiv><div class=\"wd\">Сб<\u002Fdiv><div class=\"wd\">Вс<\u002Fdiv>\n          <div class=\"d\"><\u002Fdiv><div class=\"d\"><\u002Fdiv><div class=\"d\"><\u002Fdiv><div class=\"d\"><\u002Fdiv><div class=\"d\"><a href=\"#\">1<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">2<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">3<\u002Fa><\u002Fdiv>\n          <div class=\"d\"><a href=\"#\">4<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">5<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">6<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">7<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">8<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">9<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">10<\u002Fa><\u002Fdiv>\n          <div class=\"d\"><a href=\"#\">11<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">12<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">13<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">14<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">15<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">16<\u002Fa><\u002Fdiv><div class=\"d\"><a href=\"#\">17<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pat-box\">\n        <div class=\"lab\">Алфавит-индекс имён<\u002Fdiv>\n        <div class=\"tabs-warm\" style=\"margin-bottom:12px\"><a class=\"active\">Мужские<\u002Fa><a>Женские<\u002Fa><\u002Fdiv>\n        <div class=\"alpha\"><a>А<\u002Fa><a>Б<\u002Fa><a>В<\u002Fa><a>Г<\u002Fa><a>Д<\u002Fa><a>Е<\u002Fa><a>Ж<\u002Fa><a>З<\u002Fa><a>И<\u002Fa><a>К<\u002Fa><a>Л<\u002Fa><a>М<\u002Fa><a>Н<\u002Fa><a>О<\u002Fa><a>П<\u002Fa><a>Р<\u002Fa><a>С<\u002Fa><a>Т<\u002Fa><a>Ф<\u002Fa><\u002Fdiv>\n        <div style=\"margin-top:14px;font-size:14px;line-height:1.9\"><a href=\"#\" style=\"color:var(--link);text-decoration:underline;text-underline-offset:3px\">Максим<\u002Fa>, <a href=\"#\" style=\"color:var(--link);text-decoration:underline;text-underline-offset:3px\">Пётр<\u002Fa>, <a href=\"#\" style=\"color:var(--link-warm);text-decoration:underline;text-underline-offset:3px\">Агния<\u002Fa>, <a href=\"#\" style=\"color:var(--link-warm);text-decoration:underline;text-underline-offset:3px\">Нина<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pat-box\">\n        <div class=\"lab\">Товар и pull-quote<\u002Fdiv>\n        <div class=\"prod\">\n          <img src=\"6ba43c80-60c4-4016-9978-a65c2a243b4e\" alt=\"\">\n          <div><div class=\"a\">Монах Лазарь (Афанасьев)<\u002Fdiv><div class=\"t\">Просто мама<\u002Fdiv><div class=\"meta\"><span class=\"vw\">▶ видео отзыв<\u002Fspan><span class=\"rv\">4 отзыва<\u002Fspan><\u002Fdiv><div style=\"font-size:18px;color:var(--price);margin-top:6px\">180 р<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--rule);margin-top:14px;padding-top:12px\">\n          <div style=\"font-size:24px;line-height:.5;color:var(--terracotta-400);font-weight:700\">”<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:var(--terracotta-400);margin-top:6px\">Послушание — сокровенные отношения между Старцем и послушником.<\u002Fdiv>\n          <div style=\"font-size:12px;font-style:italic;color:var(--terracotta-400);text-align:right;margin-top:8px;font-family:var(--font-narrow)\">Монах Симеон Афонский<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 12. NAVIGATION ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Navigation<\u002Fh2><span class=\"num\">12 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Главное меню — капс с разрядкой 0.18em, активный пункт терракотой. Лупа поиска — справа.<\u002Fp>\n    <div class=\"nav-sample\">\n      <div class=\"links\">\n        <a>Журнал<\u002Fa><a>События<\u002Fa><a class=\"active\">Магазин книги<\u002Fa><a>Именины<\u002Fa><a>Паломничество<\u002Fa><a>Жития святых<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 13. EMPTY / ERROR / LOADING ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Empty · error · loading<\u002Fh2><span class=\"num\">13 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Служебные состояния — тем же спокойным голосом, без восклицаний и эмодзи. Пустота объясняет, ошибка подсказывает действие, загрузка — скелетон на подложке, без спиннеров.<\u002Fp>\n    <div class=\"status-grid\">\n      <div class=\"status-card\">\n        <div class=\"cap\">Empty · поиск<\u002Fdiv>\n        <div class=\"status-body\">\n          <svg viewBox=\"0 0 24 24\" width=\"30\" height=\"30\" style=\"stroke:var(--gray-300);stroke-width:1.4;fill:none\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-4-4\"><\u002Fpath><\u002Fsvg>\n          <div class=\"big\">Ничего не нашлось<\u002Fdiv>\n          <div class=\"sm\">По запросу «Евпатий» имён нет. Проверьте написание или выберите букву в алфавите.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"status-card\">\n        <div class=\"cap\">Error · форма именин<\u002Fdiv>\n        <div class=\"status-body\" style=\"align-items:stretch;justify-content:flex-start\">\n          <div class=\"err-field\">\n            <div style=\"font-size:11px;color:var(--text-muted);margin-bottom:5px;text-align:left\">Дата рождения<\u002Fdiv>\n            <input value=\"12.13.2016\">\n            <div class=\"msg\">Проверьте дату — такого месяца нет. Формат: ДД.ММ.ГГГГ.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--text-muted);margin-top:14px;line-height:1.5;text-align:left\">Ошибка — цветом <b style=\"color:var(--danger)\">--danger<\u002Fb> плюс текст; никогда только цветом.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"status-card\">\n        <div class=\"cap\">Loading · скелетон<\u002Fdiv>\n        <div class=\"status-body\" style=\"align-items:stretch;gap:14px\">\n          <div class=\"skton\" style=\"width:40%\"><\u002Fdiv>\n          <div class=\"skton\"><\u002Fdiv>\n          <div class=\"skton\"><\u002Fdiv>\n          <div class=\"skton\" style=\"width:70%\"><\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--text-muted);margin-top:4px;text-align:left\">Подложка gray-150, shimmer 1.4s. Без спиннеров и «Загрузка…».<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 14. VOICE & TONE ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Voice &amp; tone<\u002Fh2><span class=\"num\">14 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">Пишем как редактор просветительского издания: спокойно, уважительно, на «вы». Проверка каждой фразы — <em>можно ли произнести это в храме, не повышая голоса?<\u002Fem><\u002Fp>\n    <div class=\"voice-grid\">\n      <div class=\"voice-cell\">\n        <span class=\"lab\">Как звучим<\u002Fspan>\n        <h4>Голос <em>бренда.<\u002Fem><\u002Fh4>\n        <div class=\"voice-line\"><span class=\"k\">CTA<\u002Fspan><p>Узнать<\u002Fp><\u002Fdiv>\n        <div class=\"voice-line\"><span class=\"k\">Форма<\u002Fspan><p>Ваше Имя<\u002Fp><\u002Fdiv>\n        <div class=\"voice-line\"><span class=\"k\">Заголовок<\u002Fspan><p>Как назвать ребенка?<\u002Fp><\u002Fdiv>\n        <div class=\"voice-line\"><span class=\"k\">Ошибка<\u002Fspan><p>Нашли ошибку? — Выделите и нажмите Ctrl + Enter<\u002Fp><\u002Fdiv>\n        <div class=\"voice-line\"><span class=\"k\">Подписка<\u002Fspan><p>Подпишитесь на рассылку<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"voice-cell\">\n        <span class=\"lab\">Не пишем так<\u002Fspan>\n        <h4>Что <em style=\"color:var(--text-muted);text-decoration:line-through\">не<\u002Fem> делаем.<\u002Fh4>\n        <div class=\"voice-line no\"><span class=\"k no\">CTA<\u002Fspan><p>Узнайте прямо сейчас!!! 🎉<\u002Fp><\u002Fdiv>\n        <div class=\"voice-line no\"><span class=\"k no\">Заголовок<\u002Fspan><p>ТОП-10 имён для вашего малыша<\u002Fp><\u002Fdiv>\n        <div class=\"voice-line no\"><span class=\"k no\">Ошибка<\u002Fspan><p>Упс! Что-то пошло не так 😢<\u002Fp><\u002Fdiv>\n        <div class=\"voice-line no\"><span class=\"k no\">Подписка<\u002Fspan><p>Не пропустите скидки — подпишитесь!<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sub-head\"><h3>Принципы <em>текста<\u002Fem><\u002Fh3><span class=\"tag-r\">editorial · спокойный · «вы»<\u002Fspan><\u002Fdiv>\n    <ul style=\"font-size:14px;line-height:1.7;color:var(--text-body);padding-left:18px;margin:0;max-width:760px;\">\n      <li>Эмодзи — <strong style=\"color:var(--brown-800)\">никогда<\u002Fstrong>. Кавычки — только «ёлочки».<\u002Fli>\n      <li>CTA — одно-два слова: «Узнать», «В корзину», «Отправить».<\u002Fli>\n      <li>Дореформенная орфография — только в бренде и исторических материалах, не в сервисном тексте.<\u002Fli>\n      <li>Обращение — на «вы», строчная буква: «ваших имен», а не «Ваших Имен».<\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <!-- ============ 15. ACCESSIBILITY ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Accessibility<\u002Fh2><span class=\"num\">15 / 15<\u002Fspan><\u002Fdiv>\n    <p class=\"section-intro\">WCAG AA — нижняя планка. Текст на белом читается легко; тёплые/холодные ссылки дублируют смысл не только цветом.<\u002Fp>\n    <div class=\"a11y-grid\">\n      <div class=\"a11y-card\">\n        <span class=\"lab\">Контраст текста<\u002Fspan>\n        <div class=\"demo\"><span style=\"font-size:16px;color:var(--text-body)\">Основной текст 15px<\u002Fspan><\u002Fdiv>\n        <div class=\"ratio\"><span>gray-700 на белом<\u002Fspan><span class=\"pass\">AA+<\u002Fspan><\u002Fdiv>\n        <p>Заголовки — коричневый на белом, AAA. Приглушённый текст — AA.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"a11y-card\">\n        <span class=\"lab\">Focus ring<\u002Fspan>\n        <div class=\"demo\"><input class=\"input\" style=\"border-color:var(--teal-400);box-shadow:0 0 0 3px var(--teal-100)\" value=\"Евпат\"><\u002Fdiv>\n        <div class=\"ratio\"><span>teal-100 · 3px<\u002Fspan><span class=\"pass\">видим всегда<\u002Fspan><\u002Fdiv>\n        <p>Фокус не убирается — навигация с клавиатуры должна работать.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"a11y-card\">\n        <span class=\"lab\">Touch target<\u002Fspan>\n        <div class=\"demo\"><button class=\"btn lg\">Узнать<\u002Fbutton><\u002Fdiv>\n        <div class=\"ratio\"><span>min 44×44 mobile<\u002Fspan><span class=\"pass\">ok<\u002Fspan><\u002Fdiv>\n        <p>На мобильных кнопки и ссылки-имена — не меньше 44px зоны нажатия.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PRINCIPLES ============ -->\n  <section class=\"section\">\n    <div class=\"section-head\"><h2>Design principles · recap<\u002Fh2><span class=\"num\">— / 05<\u002Fspan><\u002Fdiv>\n    <div class=\"principles\">\n      <div class=\"principle\">\n        <span class=\"num\">01<\u002Fspan>\n        <h3>Плоское — <em>не пусто.<\u002Fem><\u002Fh3>\n        <p>Никаких теней и градиентов, кроме затемнения на фото-тизерах. Иерархия держится на подложке, разделителе и капс-лейбле.<\u002Fp>\n        <div class=\"vs\"><span class=\"yes\">→ Подложка #f1f1f1<\u002Fspan><span class=\"no\">Тень<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"principle\">\n        <span class=\"num\">02<\u002Fspan>\n        <h3>Тепло и холод — <em>смысл,<\u002Fem> не декор.<\u002Fh3>\n        <p>Бирюза — интерактив и деньги. Терракота — тепло традиции: женские имена, цитаты, активный пункт меню. Цвет всегда что-то говорит.<\u002Fp>\n        <div class=\"vs\"><span class=\"yes\">→ Смысловой цвет<\u002Fspan><span class=\"no\">Цвет ради ритма<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"principle\">\n        <span class=\"num\">03<\u002Fspan>\n        <h3>Капс с разрядкой — <em>фирменный жест.<\u002Fem><\u002Fh3>\n        <p>Навигация и лейблы блоков набраны капсом с широкой разрядкой — единственный декоративный приём во всей системе.<\u002Fp>\n        <div class=\"vs\"><span class=\"yes\">→ .14–.18em<\u002Fspan><span class=\"no\">Обычный текст<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"principle\">\n        <span class=\"num\">04<\u002Fspan>\n        <h3>Орфография — <em>память,<\u002Fem> не стилизация.<\u002Fh3>\n        <p>Ъ и ѣ живут в логотипе и исторических заголовках; сервисный текст — в современной орфографии. Смешивать роли нельзя.<\u002Fp>\n        <div class=\"vs\"><span class=\"yes\">→ Бренд / жития<\u002Fspan><span class=\"no\">Везде подряд<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"principle\" style=\"grid-column: 1 / -1;\">\n        <span class=\"num\">05<\u002Fspan>\n        <h3>Просвещение <em>прежде продажи.<\u002Fem><\u002Fh3>\n        <p>Товарные блоки — в сайдбарах и внутри статей, но никогда не заслоняют журнальный и календарный контент.<\u002Fp>\n        <div class=\"vs\"><span class=\"yes\">→ Сайдбар<\u002Fspan><span class=\"no\">Поп-ап/баннер<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div class=\"footer\">\n    <span>Русскій Паломникъ · Design Guide v2<\u002Fspan>\n    <span>Источник → скриншоты действующего портала<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
